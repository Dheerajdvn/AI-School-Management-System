server:
  port: 0
  servlet:
    context-path: /api

spring:
  application:
    name: ai-student-dashboard-test

  # schema.sql is PostgreSQL-specific (ON CONFLICT ... DO NOTHING) and H2 cannot parse it.
  # Hibernate's create-drop below builds the schema for tests instead, and RoleInitializer seeds
  # the roles, so the script is redundant here.
  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 10000
      max-lifetime: 600000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          batch_size: 10
    open-in-view: false

  jackson:
    serialization:
      fail-on-empty-beans: false

  redis:
    host: localhost
    port: 6379
    timeout: 1000

ai:
  ollama:
    base-url: http://localhost:11434
    model: test-model
    temperature: 0.2
    timeout: 1
    max-tokens: 10

  embedding:
    provider: ollama
    model: test-embed
    timeout: 1s
    base-url: http://localhost:11434

  vector:
    provider: qdrant
    host: localhost
    port: 6333
    collection: test_collection
    dimension: 768
    timeout: 1s

app:
  jwt:
    secret: testSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm
    expiration: 86400000
  security:
    encryption-key: testEncryptionKeyForUnitTestsOnly32PlusChars

logging:
  level:
    root: WARN
    com.ai.dashboard: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
