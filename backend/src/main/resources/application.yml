spring:
  config:
    import: optional:classpath:application-${spring.profiles.active:dev}.yml

  application:
    name: ai-student-dashboard

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/ai_student_dashboard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci}
    username: root
    password: root@123
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          batch_size: 50
    open-in-view: false

  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: 8080
  servlet:
    context-path: /api

# ============================================
# AI / Ollama Configuration
# ============================================
ai:
  slow-query-threshold-ms: 5000
  slow-ollama-threshold-ms: 30000
  slow-prompt-threshold-ms: 1000
  max-prompt-size: 10000
  max-sql-length: 10000
  max-retries: 2
  max-result-rows: 200

  memory:
    max-conversations-per-user: 20
    context-history-limit: 3

  ollama:
    base-url: http://localhost:11434
    model: qwen2.5-coder:3b
    temperature: 0.2
    timeout: 120
    max-tokens: 2048

  embedding:
    provider: ollama
    model: nomic-embed-text
    timeout: 30s
    base-url: http://localhost:11434

  vector:
    provider: qdrant
    host: localhost
    port: 6333
    collection: course_documents
    dimension: 768
    timeout: 30s

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-please-rotate}
    expiration: ${JWT_EXPIRATION:86400000}

# Data seeding
seed:
  enabled: true
  batch-size: 10000

# Logging
logging:
  level:
    root: INFO
    com.ai.dashboard: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

  api-docs:
    path: /v3/api-docs

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
