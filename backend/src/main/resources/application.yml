spring:
  profiles:
    active: dev # Default profile for local development

  application:
    name: ai-student-dashboard

  jackson:
    serialization:
      fail-on-empty-beans: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

ai:
  slow-query-threshold-ms: 5000
  slow-ollama-threshold-ms: 30000
  slow-prompt-threshold-ms: 1000
  max-prompt-size: 10000
  max-sql-length: 10000
  max-retries: 2
  max-result-rows: 200

  memory:
    max-conversations-per-user: 20
    context-history-limit: 3

  vector:
    collection: course_documents
    dimension: 768
    timeout: 30s

logging:
  level:
    root: INFO
    com.ai.dashboard: DEBUG
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always